[versions]
# Checked on 23 October 2026 against Google Maven, Maven Central and developer.android.com.
# Network, storage and image libraries checked on 24 October 2026.
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
graphicsShapes = "1.1.0"
okhttp = "5.5.1"
serialization = "1.12.0"
datastore = "1.3.0"
work = "2.12.0"
coil = "3.6.3"
coroutines = "1.11.0"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
savedstate = "1.5.0"
junit = "4.13.2"
